{% extends "base.html" %}

{% block title %}Settings{% endblock %}
{% block page_title %}Settings{% endblock %}

{% block content %}
<div class="settings-container">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      
      <!-- ===== SINGLE SETTINGS CARD ===== -->
      <div class="settings-card">
        <div class="settings-card-header">
          <i class="fas fa-cog text-primary me-2"></i>
          <h5 class="mb-0">Account Settings</h5>
        </div>
        <div class="settings-card-body">
          <form action="{{ url_for('settings') }}" method="POST">
            
            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input type="text" class="form-control" id="username" name="username" value="{{ current_user.username }}" required minlength="3">
              <div class="form-text text-muted">Username must be at least 3 characters.</div>
            </div>

            <!-- Current Password -->
            <div class="mb-3">
              <label for="currentPassword" class="form-label fw-semibold">Current Password</label>
              <input type="password" class="form-control" id="currentPassword" name="current_password" placeholder="Enter current password" required>
              <div class="form-text text-muted">Required to change username or password.</div>
            </div>

            <!-- New Password -->
            <div class="mb-3">
              <label for="newPassword" class="form-label fw-semibold">New Password <span class="text-muted">(optional)</span></label>
              <input type="password" class="form-control" id="newPassword" name="new_password" placeholder="Enter new password (leave blank to keep current)">
              <div class="form-text text-muted">Password must be at least 8 characters if changed.</div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
              <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password</label>
              <input type="password" class="form-control" id="confirmPassword" name="confirm_password" placeholder="Confirm new password">
            </div>

            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save me-1"></i>Save Changes
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
  .settings-container {
    max-width: 900px;
    margin: 0 auto;
  }

  .settings-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    overflow: hidden;
    border: 1px solid #e9ecef;
  }

  .settings-card-header {
    padding: 1rem 1.5rem;
    background: #f8f9fa;
    border-bottom: 1px solid #e9ecef;
    display: flex;
    align-items: center;
  }

  .settings-card-header h5 {
    font-weight: 600;
  }

  .settings-card-body {
    padding: 1.5rem;
  }

  .settings-card-body .form-control:focus {
    border-color: #86b7fe;
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
  }

  .btn-primary {
    padding: 0.5rem 2rem;
  }

  @media (max-width: 576px) {
    .settings-card-body {
      padding: 1rem;
    }
    
    .settings-card-header {
      padding: 0.75rem 1rem;
    }
    
    .btn-primary {
      width: 100%;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    
    // Password confirmation validation
    if (newPassword && confirmPassword) {
      confirmPassword.addEventListener('input', function() {
        if (this.value && this.value !== newPassword.value) {
          this.classList.add('is-invalid');
          this.setCustomValidity('Passwords do not match');
        } else {
          this.classList.remove('is-invalid');
          this.setCustomValidity('');
        }
      });
      
      newPassword.addEventListener('input', function() {
        if (confirmPassword.value && this.value !== confirmPassword.value) {
          confirmPassword.classList.add('is-invalid');
          confirmPassword.setCustomValidity('Passwords do not match');
        } else {
          confirmPassword.classList.remove('is-invalid');
          confirmPassword.setCustomValidity('');
        }
      });
    }
  });
</script>
{% endblock %}
